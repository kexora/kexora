name: Deploy Kexora Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Grant GITHUB_TOKEN required permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments to avoid race conditions
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Setup Node.js runtime (v22 for Vite 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure GitHub Pages & Base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build production bundle & pre-render HTTP-200 routes
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$PAGES_BASE_PATH" ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="${PAGES_BASE_PATH%/}/"
          fi
          npm run build

      - name: Verify static HTTP-200 routes, sitemap, nojekyll & 404 page
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/CNAME
          test -f dist/services/index.html
          test -f dist/pricing/index.html
          test -f dist/our-tools/index.html

      - name: Upload Pages build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
